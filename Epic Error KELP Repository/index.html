<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="UTF-8">
    <title>KELP Addon Repo</title>
    <style>
        body { font-family: sans-serif; max-width: 800px; margin: 40px auto; padding: 0 20px; line-height: 1.5; background: #f4f4f4; }
        .addon-card { background: #fff; padding: 20px; border-radius: 5px; box-shadow: 0 2px 5px rgba(0,0,0,0.1); margin-bottom: 20px; }
        code { display: block; background: #eee; padding: 10px; margin: 10px 0; word-break: break-all; border-radius: 3px; }
        button { cursor: pointer; padding: 8px 15px; }
        h1 { border-bottom: 2px solid #333; padding-bottom: 10px; }
    </style>
</head>
<body>

    <h1>MartMaster KELP Addon Repository</h1>

    <div class="addon-card">
        <strong>Webshare.cz</strong>
        <code id="url1"> SEM ZADEJ RAW URL PRO TEN webshare.json addon. Tu najdeš na GitHubu, proste tam jen rozklikni ten soubor a dej "raw"</code>
        <button onclick="copy('url1')">Kopírovat URL</button>
    </div>

    <script>
        function copy(id) {
            const text = document.getElementById(id).innerText;
            navigator.clipboard.writeText(text);
            alert('Zkopírováno!');
        }
    </script>

</body>
</html>
